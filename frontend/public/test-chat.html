<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Test Client</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .app { width: 420px; max-width: 100%; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); overflow: hidden; display: flex; flex-direction: column; }
  .header { background: #2563eb; color: #fff; padding: 16px 20px; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header .sub { font-size: 12px; opacity: 0.8; margin-top: 4px; }
  .config-bar { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #e5e5e5; align-items: center; }
  .config-bar input { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; font-size: 13px; outline: none; }
  .config-bar input:focus { border-color: #2563eb; }
  .config-bar button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .config-bar button:disabled { opacity: 0.5; cursor: default; }
  .chat-area { height: 420px; overflow-y: auto; padding: 16px; background: #f5f5f5; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
  .msg.user { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.ai { background: #fff; color: #222; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .msg .order-badge { display: inline-flex; align-items: center; gap: 5px; background: #dcfce7; color: #166534; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-bottom: 6px; }
  .input-bar { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e5e5e5; }
  .input-bar input { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
  .input-bar input:focus { border-color: #2563eb; }
  .input-bar button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .input-bar button:disabled { opacity: 0.5; cursor: default; }
  .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; background: #fff; border-radius: 12px; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.06); max-width: 80%; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #999; animation: bounce 1.4s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  .typing span:nth-child(3) { animation-delay: -0.32s; }
  @keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }
  .info { font-size: 12px; color: #888; text-align: center; padding: 8px; }
  .error { color: #dc2626; font-size: 12px; text-align: center; padding: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Social Selling — Chat Test Client</h1>
    <div class="sub">Simulates a customer chatting via the public widget API</div>
  </div>
  <div class="config-bar" style="flex-wrap:wrap;">
    <input id="widgetId" type="text" placeholder="Widget ID (UUID)" autocomplete="off" style="flex:1;min-width:140px;">
    <input id="custName" type="text" placeholder="Customer name (optional)" autocomplete="off" style="flex:1;min-width:120px;">
    <input id="custPhone" type="text" placeholder="Phone (optional)" autocomplete="off" style="flex:1;min-width:100px;">
    <button id="startBtn" style="flex-shrink:0;">Start Chat</button>
  </div>
  <div class="chat-area" id="chatArea">
    <div class="info">Enter a widget ID above and click "Start Chat" to begin.</div>
  </div>
  <div class="input-bar">
    <input id="msgInput" type="text" placeholder="Type a message..." disabled autocomplete="off">
    <button id="sendBtn" disabled>Send</button>
  </div>
</div>

<script>
  const baseUrl = 'http://localhost:8001';
  let convId = null;
  let widgetId = null;

  const chatArea = document.getElementById('chatArea');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const startBtn = document.getElementById('startBtn');
  const widgetIdInput = document.getElementById('widgetId');

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function addMsg(role, text, order) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    let html = '';
    if (order) {
      html += '<div class="order-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Order created · ' + order.total.toFixed(2) + ' TND (' + order.items + ' items)</div>';
    }
    html += esc(text);
    d.innerHTML = html;
    chatArea.appendChild(d);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function addTyping() {
    const d = document.createElement('div');
    d.className = 'typing';
    d.id = 'typing-indicator';
    d.innerHTML = '<span></span><span></span><span></span>';
    chatArea.appendChild(d);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  function setLoading(v) {
    startBtn.disabled = v;
    sendBtn.disabled = v || !msgInput.value.trim();
    msgInput.disabled = v;
  }

  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !widgetId) return;
    msgInput.value = '';
    sendBtn.disabled = true;

    addMsg('user', text);
    addTyping();

    const isNew = !convId;
    const url = baseUrl + '/api/public/chat' + (isNew ? '' : '/' + convId);
    const payload = { widget_id: widgetId, message: text };
    if (isNew) {
      const name = document.getElementById('custName').value.trim() || undefined;
      const phone = document.getElementById('custPhone').value.trim() || undefined;
      if (name) payload.customer_name = name;
      if (phone) payload.customer_phone = phone;
    }
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error(res.status + ': ' + err);
      }
      const data = await res.json();
      convId = data.conversation_id;
      removeTyping();
      addMsg('ai', data.reply, data.order || null);
    } catch (e) {
      removeTyping();
      addMsg('ai', 'Error: ' + e.message);
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function startChat() {
    widgetId = widgetIdInput.value.trim();
    if (!widgetId) { alert('Please enter a Widget ID'); return; }
    convId = null;
    chatArea.innerHTML = '';
    setLoading(true);

    try {
      const res = await fetch(baseUrl + '/api/widget/config/' + widgetId);
      if (!res.ok) throw new Error('Widget not found or disabled');
      const config = await res.json();
      addMsg('ai', config.greeting || 'Hi! How can I help you today?');
      msgInput.disabled = false;
      msgInput.focus();
      startBtn.textContent = 'Restart Chat';
    } catch (e) {
      chatArea.innerHTML = '<div class="error">' + esc(e.message) + '</div>';
      widgetId = null;
    } finally {
      setLoading(false);
    }
  }

  startBtn.onclick = startChat;
  sendBtn.onclick = sendMessage;
  msgInput.onkeydown = (e) => { if (e.key === 'Enter' && !sendBtn.disabled) sendMessage(); };
  widgetIdInput.onkeydown = (e) => { if (e.key === 'Enter') startChat(); };
</script>
</body>
</html>
