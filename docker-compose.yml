services:
  backend:
    build: ./backend
    container_name: ss-backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ss-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
